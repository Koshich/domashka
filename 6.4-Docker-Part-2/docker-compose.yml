services:
  pushgateway:
    image: prom/pushgateway:latest
    container_name: MenschikovaE.D.-netology-pushgateway
    ports:
      - "9091:9091"
    networks:
      - netology
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: MenschikovaE.D.-netology-prometheus
    depends_on:
      - pushgateway
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - netology
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: MenschikovaE.D.-netology-grafana
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/custom.ini:/etc/grafana/custom.ini
    environment:
      - GF_PATHS_CONFIG=/etc/grafana/custom.ini
    ports:
      - "80:3000"
    networks:
      - netology
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  netology:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
    name: MenschikovaE.D.-my-netology-hw
